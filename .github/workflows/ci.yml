name: CI

# When the pipeline runs: on pushes to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Job 1: run the tests ----
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # 'python -m pytest' (not bare 'pytest') puts the repo root on the
        # import path, so 'from app.main import app' resolves in CI.
        run: python -m pytest -v

  # ---- Job 2: build the image and scan it for vulnerabilities ----
  build-and-scan:
    runs-on: ubuntu-latest
    needs: test          # only runs if 'test' passed — a quality gate
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-pipeline-demo:${{ github.sha }} .

      - name: Scan image with Trivy
        # Run Trivy from its official pinned image rather than the trivy-action,
        # whose multi-step installer proved fragile (deleted sub-action tag, then
        # a flaky binary install). A container is deterministic and portable.
        # The DB repo is pointed at the AWS ECR mirror to avoid ghcr rate limits.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2 \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            devops-pipeline-demo:${{ github.sha }}
