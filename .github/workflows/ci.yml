name: CI

# When the pipeline runs: on pushes to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Job 1: run the tests ----
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # 'python -m pytest' (not bare 'pytest') puts the repo root on the
        # import path, so 'from app.main import app' resolves in CI.
        run: python -m pytest -v

  # ---- Job 2: build the image and scan it for vulnerabilities ----
  build-and-scan:
    runs-on: ubuntu-latest
    needs: test          # only runs if 'test' passed — a quality gate
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-pipeline-demo:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: devops-pipeline-demo:${{ github.sha }}
          format: table
          exit-code: "0"          # report findings but don't fail the build (yet)
          severity: HIGH,CRITICAL
